apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-orderdb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-order
  template:
    metadata:
      labels:
        app: postgres-order
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - name: POSTGRES_DB
              value: "orderdb"
            - name: POSTGRES_USER
              value: "orderuser"
            - name: POSTGRES_PASSWORD
              value: "orderpass"
          ports:
            - containerPort: 5432
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"
          volumeMounts:
            - name: postgres-storage-order
              mountPath: /var/lib/postgresql-order/data
      volumes:
        - name: postgres-storage-order
          persistentVolumeClaim:
            claimName: postgres-order-pvc
